name: Check *.tsv
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tsvlint:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo apt-get install libtext-csv-perl
      - name: Check locales/*/*.tsv
        run: |
          for f in locales/*/*.tsv
          do
            printf '%s\n' "$f"
            if grep "\"" "$f"
            then
              echo "The tooling doesn't support the double quote character"
              exit 1;
            fi
            perl .github/workflows/tsvlint.pl < "$f"
          done
